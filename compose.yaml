# Indsæt denne i Dockge (+ Compose). Image bygges automatisk af GitHub Actions.
# Image: ghcr.io/marius-bjerregaard/komponent-shop
services:
  komponenter:
    image: ghcr.io/marius-bjerregaard/komponent-shop:latest
    container_name: komponenter
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_TOKEN=skift-mig-til-en-lang-hemmelig-streng
    volumes:
      - komponent-data:/data
volumes:
  komponent-data:
